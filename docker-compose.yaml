services:
  slides:
    build:
      context: .
      dockerfile: apps/slides/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_SLIDES
    expose:
      - '80'

  demo:
    build:
      context: .
      dockerfile: apps/demo/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_DEMO
    expose:
      - '80'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_PATH: /data/village.sqlite
    volumes:
      - api_data:/data
    expose:
      - '3001'

volumes:
  api_data:
