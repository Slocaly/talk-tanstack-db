services:
  slides:
    build:
      context: .
      dockerfile: apps/slides/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_SLIDES
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  demo:
    build:
      context: .
      dockerfile: apps/demo/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - SERVICE_FQDN_DEMO
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_PATH: /data/village.sqlite
    volumes:
      - api_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  api_data:
